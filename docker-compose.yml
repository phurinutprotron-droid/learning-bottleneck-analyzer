services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lba
      POSTGRES_USER: lba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - lba-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lba -d lba"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://lba:${POSTGRES_PASSWORD}@db:5432/lba
      ENVIRONMENT: production
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  lba-db:
