<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087f5b" />
    <meta
      name="description"
      content="Learning Bottleneck Analyzer: evidence-driven learning diagnostics and research."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%lba-logo.svg" />
    <title>LBA · Understand the learning</title>
    <style>
      .boot-loading {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #f4f4f4;
        color: #242424;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: white;
      }
      .boot-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 3px solid #dfebe5;
        border-top-color: #087f5b;
        border-radius: 50%;
        animation: boot-turn 1.2s linear infinite;
      }
      .boot-mark img {
        display: block;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root">
      <div class="boot-loading" role="status">
        <span class="boot-mark" aria-hidden="true"
          ><img src="%BASE_URL%lba-logo.svg" width="40" height="40" alt=""
        /></span>
        <span>กำลังโหลด LBA · Loading LBA</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
