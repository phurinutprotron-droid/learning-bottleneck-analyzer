# Preview deployment. Free Render PostgreSQL expires after 30 days.
services:
  - type: web
    name: lba-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lba-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://phurinutprotron-droid.github.io"]'
      - key: AI_PROVIDER
        value: deterministic
      - key: LBA_TEACHER_HANDLE
        value: lba_teacher
      - key: LBA_TEACHER_PASSWORD
        sync: false
databases:
  - name: lba-postgres
    plan: free
    databaseName: lba
    user: lba
    ipAllowList: []
